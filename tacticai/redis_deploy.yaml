apiVersion: v1
kind: Service
metadata:
  name: redis             # 서비스 이름 (코드에서 찾는 호스트명)
  namespace: tacticai     # 네임스페이스
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tacticai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:6.2-alpine  # 가벼운 Redis 이미지
        ports:
        - containerPort: 6379
